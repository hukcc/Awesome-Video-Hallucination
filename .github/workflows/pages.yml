name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Validate collection and browser
        run: |
          node --test tests/catalog.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/generate_readme.py --check
          python3 scripts/generate_relevance_review.py --check
          python3 scripts/check_catalog.py
          python3 scripts/generate_taxonomy_tree.py --check

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html README.md LICENSE new_papers.md _site/
          cp -R assets data imgs _site/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
